[package]
name = "chat-relay"
version = "0.1.2"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde_json = "1"
rand = "0.8"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
dotenvy = "0.15"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
subtle = "2"
